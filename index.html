<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Bowl Netherlands — Resultaten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Spectral:ital,wght@0,400;0,600;0,800;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CONFIG IS IN THE SCRIPT BLOCK AT THE BOTTOM — edit there only.
     ============================================================ */

  :root {
    --navy:       #010080;  /* shield navy */
    --cobalt:     #0055D4;  /* shield bright blue */
    --orange:     #F86808;  /* shield orange */
    --red:        #E4002B;  /* shield red accent */
    --white:      #ffffff;

    /* Semantic names reused throughout the stylesheet */
    --ink:        #0a0a4a;            /* deep navy text */
    --parchment:  #eef1fb;            /* page background (cool off-white) */
    --parchment2: #dde3f5;            /* subtle panel tint */
    --blood:      var(--navy);        /* primary brand fill (was dark red) */
    --blood-lite: var(--cobalt);      /* lighter primary */
    --gold:       var(--orange);      /* accent */
    --gold-lite:  #ffa04d;            /* lighter accent */
    --steel:      #5a6275;            /* muted slate-blue for secondary text */
    --green:      #2f5233;
    --shadow:     rgba(1,0,80,.28);
    --row-even:   rgba(255,255,255,.55);
    --row-odd:    rgba(0,85,212,.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Spectral', Georgia, serif;
    color: var(--ink);
    background-color: var(--parchment);
    background-image:
      radial-gradient(circle at 12% 12%, rgba(0,85,212,.14), transparent 42%),
      radial-gradient(circle at 90% 6%, rgba(248,104,8,.12), transparent 38%),
      radial-gradient(circle at 50% 104%, rgba(1,0,128,.10), transparent 52%);
    min-height: 100vh;
    line-height: 1.5;
  }

  html, body { overflow-x: hidden; }

  .wrap { max-width: 920px; margin: 0 auto; padding: 0 20px 80px; }

  /* ---------- Header ---------- */
  header {
    position: relative;
    padding: 28px 20px 22px;
    text-align: center;
    overflow: hidden;
  }
  .langtoggle {
    position: absolute; top: 16px; right: 18px;
    display: flex; gap: 4px; z-index: 5;
  }
  .flag-btn {
    width: 34px; height: 23px; padding: 0; cursor: pointer;
    border: 1.5px solid rgba(1,0,80,.3); border-radius: 4px;
    overflow: hidden; background: transparent;
    opacity: .5; transition: all .15s ease;
    display: inline-flex;
  }
  .flag-btn svg { display: block; width: 100%; height: 100%; }
  .flag-btn:hover { opacity: .85; }
  .flag-btn.active {
    opacity: 1; border-color: var(--gold);
    box-shadow: 0 0 0 2px var(--gold-lite), 2px 2px 0 var(--shadow);
  }
  header::after {
    content: "";
    position: absolute; left: 50%; bottom: 18px;
    width: 240px; height: 4px; transform: translateX(-50%); border-radius: 2px;
    background: linear-gradient(90deg, var(--gold-lite), var(--orange) 50%, var(--gold-lite));
    box-shadow: 0 1px 0 rgba(1,0,80,.15);
  }
  .crest-logo {
    display: block; margin: 0 auto 10px;
    width: clamp(60px, 10vw, 84px); height: auto;
    filter: drop-shadow(0 6px 14px rgba(1,0,80,.35));
    transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .crest-logo:hover { transform: rotate(-3deg) scale(1.05); }
  h1.series-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(34px, 6.5vw, 72px);
    line-height: .95;
    letter-spacing: .03em;
    color: var(--navy);
    text-shadow: 2px 2px 0 var(--white), 3px 3px 0 var(--cobalt), 5px 5px 0 var(--shadow);
  }
  .tagline {
    font-style: italic;
    font-size: clamp(15px, 2.4vw, 19px);
    color: var(--steel);
    margin-top: 10px;
  }

  /* ---------- Tabs / nav ---------- */
  nav.viewtabs {
    display: flex; gap: 8px; justify-content: center;
    flex-wrap: wrap; margin: 6px 0 18px;
  }
  .vtab {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 19px; letter-spacing: .12em;
    padding: 9px 24px; cursor: pointer;
    background: rgba(255,255,255,.5); color: var(--navy);
    border: 2px solid rgba(1,0,80,.18); border-radius: 999px;
    transition: all .18s ease;
  }
  .vtab:hover { color: var(--cobalt); border-color: var(--cobalt); }
  .vtab.active {
    color: var(--white); background: var(--navy);
    border-color: var(--navy);
    box-shadow: 0 3px 0 var(--orange), 0 6px 12px -4px var(--shadow);
  }

  /* ---------- Upcoming tournament banner (rotator) ---------- */
  .upcoming-rotator {
    display: flex; align-items: stretch; gap: 0;
    max-width: 760px; margin: 0 auto 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,239,222,.95));
    border: 1px solid rgba(248,104,8,.22); border-radius: 999px;
    overflow: hidden;
    box-shadow: 0 6px 24px -12px rgba(248,104,8,.55), 0 4px 14px -8px var(--shadow);
  }
  .upcoming-rotator:hover {
    box-shadow: 0 10px 30px -12px rgba(248,104,8,.55), 0 4px 14px -8px var(--shadow);
  }
  .up-label {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    font-family: 'Bebas Neue', sans-serif; letter-spacing: .12em; font-size: 14px;
    padding: 9px 16px; color: var(--white);
    background: var(--orange); white-space: nowrap;
  }
  .up-label::before { content: "🏆"; font-size: 13px; }

  .up-rotate-viewport { flex: 1 1 auto; position: relative; overflow: hidden; }
  .up-rotate-track { position: relative; height: 100%; min-height: 40px; }
  .up-item {
    position: absolute; inset: 0;
    display: flex; align-items: center;
    padding: 0 6px; white-space: nowrap;
    opacity: 0; transition: opacity .6s ease; pointer-events: none;
  }
  .up-item.active { opacity: 1; pointer-events: auto; }

  .up-next {
    flex: 0 0 auto; cursor: pointer;
    width: 42px; border: none; background: transparent;
    color: var(--cobalt); font-size: 26px; line-height: 1;
    transition: all .15s ease;
    border-left: 1px solid rgba(248,104,8,.2);
  }
  .up-next:hover { color: var(--white); background: var(--orange); }

  /* Shared item appearance */
  .up-entry {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 18px; text-decoration: none; color: var(--navy);
    font-size: 15px; transition: color .15s ease;
  }
  .up-entry:hover { color: var(--orange); }
  .up-entry .up-name { font-weight: 700; }
  .up-entry .up-date { font-style: italic; color: var(--steel); font-size: 14px; }
  .up-entry .up-sep { color: var(--cobalt); opacity: .5; }

  @media (max-width: 680px) {
    .up-label { padding: 8px 12px; font-size: 13px; }
    .up-entry { font-size: 14px; padding: 8px 14px; }
    .up-next { width: 38px; font-size: 22px; }
  }

  /* ---------- Panels ---------- */
  .panel { display: none; animation: rise .4s ease both; }
  .panel.show { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px);} to {opacity:1; transform:none;} }

  .panel-head {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
  }
  .panel-head h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: .04em; color: var(--ink);
  }

  /* ---------- Results layout: sidebar + main ---------- */
  .results-layout { display: flex; gap: 26px; align-items: flex-start; }
  .sidebar-wrap { flex: 0 0 234px; width: 234px; }
  .sidebar {
    display: flex; flex-direction: column; gap: 6px;
    overflow: hidden;
    position: relative;
    transition: max-height .3s ease;
  }
  /* Collapsed: clip to roughly the table height; a fade hints at more. */
  .sidebar.collapsed { /* max-height set inline from JS to match table */ }
  .sidebar.collapsed::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46px;
    background: linear-gradient(transparent, var(--parchment));
    pointer-events: none;
  }
  .show-more {
    width: 100%; margin-top: 6px;
    font-family: 'Bebas Neue', sans-serif; letter-spacing: .1em; font-size: 14px;
    padding: 7px; cursor: pointer;
    background: transparent; color: var(--navy);
    border: 1px solid rgba(1,0,80,.28); border-radius: 6px;
    transition: all .15s ease;
  }
  .show-more:hover { background: rgba(0,85,212,.1); border-color: var(--cobalt); }
  .retry {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 120px; margin-top: 14px; padding: 10px 16px;
    border: 1px solid rgba(0,85,212,.28); border-radius: 8px;
    background: rgba(255,255,255,.95); color: var(--navy);
    cursor: pointer; font-size: 14px; transition: all .15s ease;
  }
  .retry:hover { background: rgba(0,85,212,.08); border-color: var(--cobalt); }
  .show-future { margin-top: 0; margin-bottom: 6px; }
  .show-future.on { background: rgba(0,85,212,.12); }
  .coach-name-btn {
    border: 0; background: transparent; padding: 0; color: inherit;
    font: inherit; font-weight: 600; text-align: left; cursor: pointer;
    text-decoration: underline; text-decoration-color: rgba(0,85,212,.35);
    text-underline-offset: 2px;
  }
  .coach-name-btn:hover { color: var(--cobalt); text-decoration-color: var(--cobalt); }
  .results-main { flex: 1 1 auto; min-width: 0; }
  .coach-modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(1,0,80,.48); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .coach-modal-backdrop[hidden] { display: none !important; }
  .coach-modal {
    width: min(720px, 100%); max-height: min(86vh, 760px);
    overflow: auto; background: var(--parchment); border-radius: 14px;
    box-shadow: 0 24px 70px rgba(1,0,80,.28); border: 1px solid rgba(1,0,80,.14);
    padding: 22px 24px 24px; position: relative;
  }
  .coach-modal-close {
    position: absolute; right: 12px; top: 10px; border: 0; background: transparent;
    color: var(--navy); font-size: 28px; cursor: pointer; line-height: 1;
  }
  .coach-modal-header { margin-bottom: 16px; }
  .coach-modal-title {
    font-family: 'Bebas Neue', sans-serif; font-size: clamp(24px, 4vw, 32px);
    letter-spacing: .04em; color: var(--navy); margin-bottom: 4px;
  }
  .coach-modal-subtitle { color: var(--steel); font-size: 15px; }
  .coach-modal-summary {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px;
  }
  .coach-modal-metric {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 999px; background: rgba(255,255,255,.72);
    border: 1px solid rgba(1,0,80,.1); color: var(--navy); font-size: 14px;
  }
  .coach-modal-metric-label { color: var(--steel); font-size: 13px; }
  .coach-modal-metric strong { font-weight: 700; color: var(--navy); }
  .coach-modal-naf {
    margin-top: 10px; display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 999px; background: rgba(0,85,212,.08);
    color: var(--navy); font-size: 14px;
    flex-wrap: wrap;
  }
  .coach-modal-naf a { color: var(--cobalt); font-weight: 600; text-decoration: none; }
  .coach-modal-naf a:hover { color: var(--orange); }
  .coach-modal-naf-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.05em; height: 1.05em; margin-left: .25em;
    border-radius: 50%; background: rgba(0,85,212,.12); color: var(--cobalt);
    font-size: .95em; line-height: 1;
  }
  .coach-modal-list { display: grid; gap: 10px; }
  .coach-modal-item {
    display: flex; justify-content: space-between; gap: 14px; align-items: center;
    padding: 12px 13px; border-radius: 10px; border: 1px solid rgba(1,0,80,.12);
    background: rgba(255,255,255,.72);
  }
  .coach-modal-item.counting {
    border-color: rgba(248,104,8,.28); box-shadow: inset 3px 0 0 var(--orange);
    background: linear-gradient(90deg, rgba(248,104,8,.12), rgba(255,255,255,.72));
  }
  .coach-modal-item.reserve {
    border-color: rgba(47,82,51,.22); box-shadow: inset 3px 0 0 var(--green);
    background: linear-gradient(90deg, rgba(47,82,51,.09), rgba(255,255,255,.72));
  }
  .coach-modal-item.historic { opacity: .82; }
  .coach-modal-item-name { font-weight: 700; color: var(--navy); }
  .coach-modal-item-date { font-size: 13px; color: var(--steel); margin-top: 2px; }
  .coach-modal-item-meta { text-align: right; min-width: 140px; }
  .coach-modal-points { font-weight: 700; color: var(--navy); }
  .coach-modal-status {
    margin-top: 4px; display: inline-block; padding: 4px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 700; letter-spacing: .03em;
  }
  .coach-modal-status.active { background: rgba(0,85,212,.12); color: var(--cobalt); }
  .coach-modal-status.reserve { background: rgba(47,82,51,.12); color: var(--green); }
  .coach-modal-status.historic { background: rgba(1,0,80,.08); color: var(--steel); }
  #results-host { position: relative; }
  #results-host.loading .tablecard {
    filter: grayscale(.35) brightness(1.05);
    opacity: .75;
  }
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(1px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 1;
  }
  .loading-overlay .state {
    padding: 0;
    background: transparent;
    color: var(--ink);
  }
.standings-meta {
    font-style: italic; color: var(--steel); font-size: 15px;
    text-align: center; margin-bottom: 14px;
  }
  .standings-meta b { font-style: normal; color: var(--ink); }
  /* Caption inside the tablecard (tournament name + date) */
  .tablecard-caption {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; padding: 12px 18px 10px;
    border-bottom: 1px solid rgba(1,0,80,.10);
  }
  .tablecard-caption-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(18px, 3vw, 26px);
    letter-spacing: .04em; color: var(--navy); line-height: 1;
  }
  .tablecard-caption-date {
    font-style: italic; color: var(--steel); font-size: 14px; white-space: nowrap;
  }

  .tourney-item {
    text-align: left; cursor: pointer; width: 100%;
    background: rgba(255,255,255,.55);
    border: 1px solid rgba(1,0,80,.12);
    border-left: 3px solid transparent;
    border-radius: 6px; padding: 10px 12px;
    transition: all .15s ease;
    display: flex; flex-direction: column; gap: 3px;
  }
  .tourney-item:hover { background: rgba(0,85,212,.12); border-left-color: var(--orange); }
  .tourney-item.disabled { cursor: default; }
  .tourney-item.disabled .ti-text,
  .tourney-item.disabled .ti-date { opacity: .45; }
  .tourney-item.disabled .ti-flag { opacity: 1; filter: none; }
  .tourney-item.disabled:hover {
    background: rgba(255,255,255,.55); border-left-color: transparent;
  }
  .tourney-item.active {
    background: var(--blood); border-left-color: var(--gold-lite);
    box-shadow: 2px 2px 0 var(--shadow);
  }
  .tourney-item.active .ti-name,
  .tourney-item.active .ti-date { color: var(--parchment); }
  .ti-name {
    font-weight: 600; font-size: 15px; color: var(--ink);
    display: flex; align-items: center; gap: 6px; line-height: 1.25;
  }
  .ti-text { flex: 1 1 auto; }
  .ti-date { font-size: 13px; color: var(--steel); font-style: italic; }
  .ti-flag {
    flex: 0 0 auto; font-size: 13px; cursor: help; margin-left: auto;
    filter: saturate(.9);
  }

  /* Legend — fixed below the list, always visible */
  .sidebar-legend {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(1,0,80,.16);
    font-size: 12px; color: var(--steel); line-height: 1.7;
  }
  .sidebar-legend span { display: block; }

  /* Mobile tournament picker — hidden on desktop */
  .mobile-picker { display: none; }
  .sidebar-collapsible { display: block; }

  @media (max-width: 680px) {
    .results-layout { flex-direction: column; min-width: 0; }
    .results-layout > * { min-width: 0; max-width: 100%; }
    .sidebar-wrap { flex-basis: auto; width: 100%; margin-bottom: 8px; }
    .sidebar.collapsed { max-height: none !important; }
    .sidebar.collapsed::after { display: none; }
    .show-more { display: none; }
  .retry {
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: 14px; padding: 10px 16px;
    border: 1px solid rgba(0,85,212,.28); border-radius: 8px;
    background: rgba(255,255,255,.95); color: var(--navy);
    cursor: pointer; font-size: 14px; transition: all .15s ease;
  }
  .retry:hover { background: rgba(0,85,212,.08); border-color: var(--cobalt); }

    /* Show the picker button; hide the list until opened */
    .mobile-picker {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; cursor: pointer;
      font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: .08em;
      padding: 12px 16px; color: var(--white);
      background: var(--navy); border: none; border-radius: 8px;
      box-shadow: 0 3px 0 var(--orange), 0 6px 12px -4px var(--shadow);
    }
    .mp-caret { transition: transform .2s ease; }
    .mobile-picker.open .mp-caret { transform: rotate(180deg); }
    .sidebar-collapsible {
      display: none;
      margin-top: 10px;
      animation: rise .25s ease both;
    }
    .sidebar-wrap.open .sidebar-collapsible { display: block; }

    /* On mobile, hide NAF number (both pages) and Team (results) so the
       tables fit without horizontal scrolling. */
    .col-nafnr, .col-nafnumber, .col-team { display: none; }
    .results-main table,
    #standings-host table { min-width: 0; }
    .tablecard-caption { padding: 10px 14px 8px; }
    .tablecard-caption-name { font-size: clamp(16px, 5vw, 22px); }
  }

  /* ---------- Table ---------- */
  .tablecard {
    background: linear-gradient(180deg, rgba(255,255,255,.70), rgba(255,255,255,.45));
    border: 1px solid rgba(1,0,80,.14);
    border-radius: 8px;
    box-shadow: 0 14px 38px -16px var(--shadow);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table { width: 100%; border-collapse: collapse; }
  tr.medal td.pos, td.pos { white-space: nowrap; }
  thead th {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px; letter-spacing: .14em; text-align: left;
    padding: 14px 18px; color: var(--white);
    background: linear-gradient(180deg, var(--navy), #00006a);
    border-bottom: 3px solid var(--orange);
  }
  thead th.num { text-align: center; width: 64px; }
  tbody td {
    padding: 13px 18px; border-top: 1px solid rgba(1,0,80,.07);
    font-size: 16px;
  }
  tbody tr:nth-child(even) { background: var(--row-even); }
  tbody tr:nth-child(odd)  { background: var(--row-odd); }
  tbody tr:hover { background: rgba(0,85,212,.14); }
  td.pos {
    font-family: 'JetBrains Mono', monospace; font-weight: 600;
    text-align: center; color: var(--cobalt);
  }
  td.naf { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--steel); }
  a.naf-link {
    color: var(--cobalt); text-decoration: none;
    border-bottom: 1px dotted var(--cobalt); transition: all .12s ease;
  }
  a.naf-link:hover { color: var(--orange); border-bottom-color: var(--orange); }
    span.risk-icon {
      display: inline-block; margin-left: 6px; cursor: help;
      font-size: 14px; opacity: 0.8; transition: opacity .12s ease;
    }
    span.risk-icon:hover { opacity: 1; }
  td.name { font-weight: 600; color: var(--navy); }
  td.team { font-style: italic; color: var(--steel); }

  /* Top-4 highlight (standings + results) */
  tr.medal td.pos { color: var(--ink); font-weight: 700; position: relative; }
  tr.rank1 td.pos::before { content:"🥇"; margin-right:4px; }
  tr.rank2 td.pos::before { content:"🥈"; margin-right:4px; }
  tr.rank3 td.pos::before { content:"🥉"; margin-right:4px; }
  tr.rank4 td.pos::before { content:"🐤"; margin-right:4px; }
  /* Wooden spoon — last place */
  tr.spoon td.pos { position: relative; font-weight: 700; }
  tr.spoon td.pos::before {
    content:"🥄"; margin-right:4px; display: inline-block;
    filter: sepia(1) saturate(1.6) hue-rotate(-12deg) brightness(.9);
  }
  tr.spoon { background: linear-gradient(90deg, rgba(120,90,50,.12), transparent) !important; }
  /* Row tints leaning to orange / red / white / blue, softened for the page */
  tr.rank2 { background: linear-gradient(90deg, rgba(228,0,43,.16), transparent) !important; }
  tr.rank3 { background: linear-gradient(90deg, rgba(255,255,255,.9), rgba(255,255,255,.2)) !important; }
  tr.rank4 { background: linear-gradient(90deg, rgba(0,85,212,.18), transparent) !important; }

  /* Champion row — stands out the most */
  tr.rank1 {
    background: linear-gradient(90deg, rgba(248,104,8,.42), rgba(255,160,77,.18) 55%, transparent) !important;
    box-shadow: inset 4px 0 0 var(--orange), inset 0 0 22px rgba(248,104,8,.12);
  }
  tr.rank1 td { padding-top: 17px; padding-bottom: 17px; }
  tr.rank1 td.pos {
    font-size: 19px; color: var(--orange);
  }
  tr.rank1 td.pos::before { font-size: 20px; margin-right: 5px; }
  tr.rank1 td.name {
    font-size: 17px; font-weight: 800; letter-spacing: .01em;
    color: var(--navy);
  }

  /* ---------- States ---------- */
  .state {
    text-align: center; padding: 60px 20px; color: var(--steel);
    font-style: italic; font-size: 17px;
  }
  .state.err {
    color: var(--red); font-style: normal;
    background: rgba(228,0,43,.07); border: 1px dashed var(--red);
    border-radius: 6px;
  }
  .state .small { display:block; font-size: 13px; font-style: italic; margin-top: 10px; color: var(--steel); }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 18px;
    border: 3px solid rgba(0,85,212,.25); border-top-color: var(--orange);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg);} }

  footer {
    text-align: center; margin-top: 50px; padding-top: 22px;
    border-top: 1px solid rgba(1,0,80,.15);
    font-size: 13px; color: var(--steel); font-style: italic;
  }
  footer a { color: var(--cobalt); }
  .footer-action {
    margin-left: 10px; padding: 0; border: none;
    background: transparent; color: var(--cobalt);
    cursor: pointer; font: inherit; text-decoration: underline;
  }
  .footer-action:hover { color: var(--navy); }
  .footer-status {
    margin-left: 12px; color: var(--steel); font-size: 13px;
  }
</style>

const TAB_CACHE = new Map();

function readLocalCache() {
  if (typeof localStorage === "undefined") return {};
  try {
    return JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY) || "{}") || {};
  } catch {
    return {};
  }
}
function writeLocalCache(cache) {
  if (typeof localStorage === "undefined") return;
  try {
    localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(cache));
  } catch {
    // ignore localStorage failures
  }
}
function getCachedTab(key) {
  if (TAB_CACHE.has(key)) return TAB_CACHE.get(key);
  const cache = readLocalCache();
  const entry = cache[key];
  if (!entry || typeof entry.ts !== "number" || !entry.value) return null;
  if (Date.now() - entry.ts > CACHE_EXPIRE_MS) {
    delete cache[key];
    writeLocalCache(cache);
    return null;
  }
  TAB_CACHE.set(key, entry.value);
  return entry.value;
}
function setCachedTab(key, value) {
  TAB_CACHE.set(key, value);

  cache[key] = { ts: Date.now(), value };

  }
  writeLocalCache(cache);
}
function clearCache() {
  TAB_CACHE.clear();

// Accepts either a tab name (string) or {gid:"..."} to target a tab.
const gvizURL = (target) => {
  const base = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&headers=1`;
  if (target && typeof target === "object" && target.gid)
    return `${base}&gid=${encodeURIComponent(target.gid)}`;
  return `${base}&sheet=${encodeURIComponent(target)}`;
};

// Minimal, correct CSV parser (handles quoted fields, commas, newlines).
function parseCSV(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// Fetch a tab and return {headers:[], rows:[{}]}
async function fetchTab(target) {
  const key = typeof target === "string" ? target : `gid:${target.gid}`;
  const cached = getCachedTab(key);
  if (cached) return cached;

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
  let res;
  try {
    res = await fetch(gvizURL(target), { signal: controller.signal });
  } catch (err) {
    if (err.name === "AbortError") throw new Error("timeout");
    throw err;
  } finally {
    clearTimeout(timeoutId);
  }

  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const txt = await res.text();
  if (txt.trim().startsWith("<")) throw new Error("not-public"); // got an HTML error page
  const grid = parseCSV(txt).filter(r => r.some(c => c.trim() !== ""));
  if (!grid.length) return { headers: [], rows: [] };
  const headers = grid[0].map(h => h.trim());
  const rows = grid.slice(1).map(r => {
    const o = {}; headers.forEach((h, i) => o[h] = (r[i] ?? "").trim()); return o;
  });
  const result = { headers, rows };
  setCachedTab(key, result);
  return result;
}

function medalClass(i) {
  return i === 0 ? "medal rank1" : i === 1 ? "medal rank2"
       : i === 2 ? "medal rank3" : i === 3 ? "medal rank4" : "";
}

// Escape untrusted text (Sheet values) before putting it in innerHTML.
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function sanitizeHref(url) {
  const value = String(url || "").trim();
  if (!value) return "#";
  try {
    const parsed = new URL(value, location.origin);
    return parsed.protocol === "http:" || parsed.protocol === "https:"
      ? parsed.href
      : "#";
  } catch {
    return "#";
  }
}

// Sort rows descending by a numeric column. Non-numbers sort to the bottom.
function sortDesc(rows, col) {
  const num = (v) => {
    const n = parseFloat(String(v).replace(",", "."));
    return Number.isFinite(n) ? n : -Infinity;
  };
  return [...rows].sort((a, b) => num(b[col]) - num(a[col]));
}

function renderTable(host, cols, rows, opts = {}) {
  if (!rows.length) {
    host.innerHTML = `<div class="state">${t("noResults")}</div>`;
    return;
  }
  // When autoPos is set, prepend a generated rank column ("#").
  const allCols = opts.autoPos ? [{ key: "pos", _auto: true }, ...cols] : cols;
  const thead = allCols.map((c, i) =>
    `<th class="col-${c.key} ${i === 0 ? "num" : ""}">${tcol(c.key)}</th>`).join("");
  const body = rows.map((r, ri) => {
    let cls = opts.medals ? medalClass(ri) : "";
    // Wooden spoon on the very last row, but not if that row already
    // carries a top-4 medal (i.e. very short lists).
    if (opts.medals && !opts.noSpoon && ri === rows.length - 1 && !cls) cls = "spoon";
    const tds = allCols.map((c, ci) => {
      let v, klass = "";
      if (c._auto) { v = String(ri + 1); klass = "pos"; }
      else {
        v = r[c.col] ?? "";
        if (ci === 0) klass = "pos";
        else if (/naf/i.test(c.col)) klass = "naf";
        else if (/team/i.test(c.col)) klass = "team";
        else if (/deelnemer|coach|naam/i.test(c.col)) klass = "name";
          else if (/points|punten/i.test(c.col)) klass = "points";
      }
      let cell = esc(v) || "—";
      // Add risk icon to points column if coach has points in a soonest-expiring tournament
      if (klass === "points" && opts.riskMap) {
        const nafCol = CONFIG.STANDINGS_COLUMNS.find(col => col.key === "nafnr")?.col;
        const nafNum = (r[nafCol] || "").trim();
        if (opts.riskMap.has(nafNum)) {
          const riskInfo = opts.riskMap.get(nafNum);
          const tmpl = t(riskInfo.points === 1 ? 'riskTitleSingular' : 'riskTitlePlural');
          const title = (tmpl || '{name}: {points} points expire on {date}')
            .replace('{name}', esc(riskInfo.tourney.name))
            .replace('{points}', String(riskInfo.points))
            .replace('{date}', esc(fmtDate(riskInfo.tourney.expiry)));
          cell += ` <span class="risk-icon" title="${title}">📉</span>`;
        }
      }
      if (klass === "name" && opts.coachModal) {
        const nameValue = r[CONFIG.STANDINGS_COLUMNS.find(col => col.key === "name")?.col] || "";
        const nafValue = (r[CONFIG.STANDINGS_COLUMNS.find(col => col.key === "nafnr")?.col] || "").trim();
        cell = `<button type="button" class="coach-name-btn" data-row-index="${ri}" data-rank="${ri + 1}" data-name="${esc(nameValue)}" data-naf="${esc(nafValue)}">${esc(nameValue)}</button>`;
      } else if (klass === "naf") {
        cell = esc(v) || "—";
      }
      return `<td class="col-${c.key} ${klass}">${cell}</td>`;
    }).join("");
    return `<tr class="${cls}">${tds}</tr>`;
  }).join("");
  const captionHTML = opts.caption
    ? `<div class="tablecard-caption">` +
      `<span class="tablecard-caption-name">${esc(opts.caption.name)}</span>` +
      (opts.caption.date ? `<span class="tablecard-caption-date">${esc(opts.caption.date)}</span>` : ``) +
      `</div>` : ``;
  host.innerHTML =
    `<div class="tablecard">${captionHTML}<table><thead><tr>${thead}</tr></thead><tbody>${body}</tbody></table></div>`;

  if (opts.coachModal) {
    host.querySelectorAll('.coach-name-btn').forEach(btn => {
      btn.addEventListener('click', () => openCoachModal(
        rows[Number(btn.getAttribute('data-row-index'))],
        Number(btn.getAttribute('data-rank')) || null
      ));
    });
  }
}

let activeCoachModalRow = null;
let activeCoachModalRank = null;

function getCoachModalData(row, rank = null) {
  const headers = Object.keys(row || {});
  const normalize = (text) => String(text || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "");
  const remainingHeaders = [...headers];
  const nameCol = CONFIG.STANDINGS_COLUMNS.find(col => col.key === "name")?.col;
  const nafCol = CONFIG.STANDINGS_COLUMNS.find(col => col.key === "nafnr")?.col;
  const today = new Date();

  const history = TOURNAMENTS.map(tourney => {
    const normalizedCode = normalize(tourney.tab);
    let bestHeader = remainingHeaders.find(h => normalize(h) === normalizedCode);
    if (!bestHeader) {
      const normalizedName = normalize(tourney.name);
      bestHeader = remainingHeaders.find(h => normalize(h) === normalizedName);
    }
    if (!bestHeader) return null;
    remainingHeaders.splice(remainingHeaders.indexOf(bestHeader), 1);
    const rawValue = row[bestHeader] ?? "";
    const trimmed = String(rawValue).trim();
    if (!trimmed) return null;
    const points = parseFloat(trimmed.replace(",", "."));
    const activeNow = Boolean(tourney.date && tourney.date <= today && (!tourney.expiry || tourney.expiry >= today));
    return {
      tourney,
      points: Number.isFinite(points) ? points : 0,
      activeNow
    };
  }).filter(Boolean);

  const activeTournamentCount = TOURNAMENTS.filter(tourney => {
    const tourneyDate = tourney.date;
    return Boolean(tourneyDate && tourneyDate <= today && (!tourney.expiry || tourney.expiry >= today));
  }).length;
  const countLimit = Math.max(0, Math.ceil(activeTournamentCount / 2));
  const countedTabs = new Set(
    history
      .filter(item => item.activeNow && item.points > 0)
      .sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        return (a.tourney.date?.getTime() || 0) - (b.tourney.date?.getTime() || 0);
      })
      .slice(0, countLimit)
      .map(item => item.tourney.tab)
  );

  const rankedHistory = history
    .map(item => ({
      ...item,
      counts: Boolean(item.activeNow && countedTabs.has(item.tourney.tab))
    }))
    .sort((a, b) => {
      const aTime = a.tourney.date ? a.tourney.date.getTime() : 0;
      const bTime = b.tourney.date ? b.tourney.date.getTime() : 0;
      return bTime - aTime;
    });

  const pointsCol = CONFIG.STANDINGS_COLUMNS.find(col => col.key === "points")?.col;
  const totalPoints = parseFloat(String(row?.[pointsCol] ?? "").replace(",", "."));

  return {
    name: row?.[nameCol] || "",
    naf: (row?.[nafCol] || "").trim(),
    rank: Number.isFinite(rank) ? rank : null,
    totalPoints: Number.isFinite(totalPoints) ? totalPoints : 0,
    history: rankedHistory
  };
}

function renderCoachModal() {
  const backdrop = document.getElementById("coach-modal-backdrop");
  const modal = backdrop?.querySelector('.coach-modal');
  const title = document.getElementById("coach-modal-title");
  const subtitle = document.getElementById("coach-modal-subtitle");
  const nafHost = document.getElementById("coach-modal-naf");
  const listHost = document.getElementById("coach-modal-list");
  if (!backdrop || !modal || !title || !subtitle || !nafHost || !listHost) return;

  if (!activeCoachModalRow) {
    backdrop.hidden = true;
    backdrop.style.display = "none";
    modal.hidden = true;
    modal.style.display = "none";
    modal.setAttribute('aria-hidden', 'true');
    title.textContent = "";
    subtitle.textContent = "";
    nafHost.hidden = true;
    nafHost.innerHTML = "";
    listHost.innerHTML = "";
    return;
  }

  const data = getCoachModalData(activeCoachModalRow, activeCoachModalRank);
  title.textContent = data.name || t("coachModalTitle");
  subtitle.textContent = t("coachModalSubtitle");
  const summaryHost = document.getElementById("coach-modal-summary");
  if (summaryHost) {
    summaryHost.innerHTML = `
      <div class="coach-modal-metric">
        <span class="coach-modal-metric-label">${t("coachModalTotal")}</span>
        <strong>${data.totalPoints} ${t("coachModalPoints")}</strong>
      </div>
      <div class="coach-modal-metric">
        <span class="coach-modal-metric-label">${t("coachModalPosition")}</span>
        <strong>${data.rank ? `#${data.rank}` : "—"}</strong>
      </div>
    `;
  }
  if (data.naf) {
    const nafUrl = `https://member.thenaf.net/index.php?module=NAF&type=coachpage&coach=${data.naf}`;
    nafHost.innerHTML = `<span>NAF #</span> <a href="${nafUrl}" target="_blank" rel="noopener noreferrer" title="${esc(t("coachModalNafHint"))}">${esc(data.naf)}<span class="coach-modal-naf-icon" aria-hidden="true">↗</span></a>`;
    nafHost.hidden = false;
  } else {
    nafHost.hidden = true;
    nafHost.innerHTML = "";
  }

  if (!data.history.length) {
    listHost.innerHTML = `<div class="state">${t("coachModalNoHistory")}</div>`;
  } else {
    listHost.innerHTML = data.history.map(item => {
      const statusClass = item.counts ? "active" : item.activeNow ? "reserve" : "historic";
      const statusText = item.counts ? t("coachModalCountsNow") : item.activeNow ? t("coachModalReserve") : t("coachModalNoLongerCounts");
      const itemClass = item.counts ? "counting" : item.activeNow ? "reserve" : "historic";
      return `
        <div class="coach-modal-item ${itemClass}">
          <div>
            <div class="coach-modal-item-name">${esc(item.tourney.name)}</div>
            <div class="coach-modal-item-date">${item.tourney.date ? fmtDate(item.tourney.date) : ""}</div>
          </div>
          <div class="coach-modal-item-meta">
            <div class="coach-modal-points">${item.points} ${t("coachModalPoints")}</div>
            <div class="coach-modal-status ${statusClass}">${statusText}</div>
          </div>
        </div>
      `;
    }).join("");
  }
  backdrop.hidden = false;
  backdrop.style.display = "flex";
  modal.hidden = false;
  modal.style.display = "block";
  modal.setAttribute('aria-hidden', 'false');
}

function openCoachModal(row, rank = null) {
  activeCoachModalRow = row;
  activeCoachModalRank = rank;
  renderCoachModal();
}

function closeCoachModal() {
  activeCoachModalRow = null;
  activeCoachModalRank = null;
  renderCoachModal();
}

function loading(host, msg) {
  const currentTable = host.querySelector('.tablecard');
  if (currentTable) {
    host.classList.add('loading');
    let overlay = host.querySelector('.loading-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'loading-overlay';
      host.appendChild(overlay);
    }
    overlay.innerHTML = `<div class="state"><div class="spinner"></div>${msg}</div>`;
  } else {
    host.innerHTML = `<div class="state"><div class="spinner"></div>${msg}</div>`;
  }
}
function clearLoadingOverlay(host) {
  host.classList.remove('loading');
  const overlay = host.querySelector('.loading-overlay');
  if (overlay) overlay.remove();
}
function errorState(host, tab, err) {
  clearLoadingOverlay(host);
  const isTimeout = err && err.message === "timeout";
  host.innerHTML =
    `<div class="state err">${t("errResults")}
      <span class="small">${isTimeout ? t("errTimeout") : t("errResultsHint")} ${isTimeout ? "" : `(\"<b>${esc(tab)}</b>\")`}</span>` +
      (isTimeout ? `<button class="retry">${t("retry")}</button>` : "") +
    `</div>`;
  const retryBtn = host.querySelector(".retry");
  if (retryBtn) retryBtn.addEventListener("click", () => loadResults(tab));
}

async function loadStandings() {
  const host = document.getElementById("standings-host");
  loading(host, t("loadingStandings"));
  try {
    let { rows } = await fetchTab(CONFIG.STANDINGS_TAB);
    // Only show participants with 1 or more points.
    const pts = CONFIG.STANDINGS_SORT_DESC || "Punten";
    rows = rows.filter(r => {
      const n = parseFloat(String(r[pts] ?? "").replace(",", "."));
      return Number.isFinite(n) && n >= 1;
    });
    if (CONFIG.STANDINGS_SORT_DESC) rows = sortDesc(rows, CONFIG.STANDINGS_SORT_DESC);
    const riskData = getExpiryRiskData(rows);
    renderTable(host, CONFIG.STANDINGS_COLUMNS, rows, { 
      medals: true, 
      autoPos: true, 
      noSpoon: true,
      riskMap: riskData?.riskMap,
      coachModal: true
    });
  } catch (e) {
    errorState(host, CONFIG.STANDINGS_TAB);
  }
}

let currentResultsTab = null;
async function loadResults(tab, meta) {
  currentResultsTab = tab;
  const host = document.getElementById("results-host");
  loading(host, t("loadingResults"));
  try {
    let { rows } = await fetchTab(tab);
    // Sort by placing (Resultaat) ascending: 1, 2, 3, ...
    const posCol = CONFIG.RESULT_COLUMNS[0].col;
    rows.sort((a, b) => {
      const na = parseFloat(String(a[posCol] ?? "").replace(",", "."));
      const nb = parseFloat(String(b[posCol] ?? "").replace(",", "."));
      return (Number.isFinite(na) ? na : Infinity) - (Number.isFinite(nb) ? nb : Infinity);
    });
    // Drop configured columns that are entirely empty for this tournament.
    const drop = new Set(CONFIG.DROP_IF_EMPTY || []);
    const cols = CONFIG.RESULT_COLUMNS.filter(c => {
      if (!drop.has(c.col)) return true;
      return rows.some(r => (r[c.col] || "").trim() !== "");
    });
    const sel = TOURNAMENTS.find(it => it.tab === tab);
    const caption = sel ? { name: sel.name, date: sel.date ? fmtDate(sel.date) : "" } : null;
    clearLoadingOverlay(host);
    renderTable(host, cols, rows, { medals: true, caption });
    if (currentView === "results") {
      sidebarHeightSynced = true;
      syncSidebarHeight();
    }
  } catch (e) {
    errorState(host, tab);
  }
}

// Match the collapsed sidebar height to the results table; show "toon meer"
// only when the list is genuinely taller than the table beside it.
let sidebarExpanded = false;
let sidebarHeightSynced = false;
function syncSidebarHeight() {
  if (currentView !== "results") return;
  const sidebar = document.getElementById("tourney-list");
  const main = document.querySelector(".results-main");
  const btn = document.getElementById("show-more");
  if (!sidebar || !main || !btn) return;
  // Two frames so the results table has actually laid out before measuring.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const tableH = main.offsetHeight;
    // Measure natural list height without the collapse cap.
    const prev = sidebar.style.maxHeight;
    sidebar.style.maxHeight = "";
    const listH = sidebar.scrollHeight;
    sidebar.style.maxHeight = prev;

    const overflows = listH > tableH + 12;
    if (sidebarExpanded || !overflows) {
      sidebar.classList.remove("collapsed");
      sidebar.style.maxHeight = "";
      btn.hidden = !overflows;            // only show toggle if it can collapse
      btn.textContent = sidebarExpanded ? t("showLess") : t("showMore");
    } else {
      sidebar.classList.add("collapsed");
      sidebar.style.maxHeight = Math.max(tableH, 160) + "px";
      btn.hidden = false;
      btn.textContent = t("showMore");
    }
  }));
}

document.getElementById("show-more").addEventListener("click", () => {
  sidebarExpanded = !sidebarExpanded;
  syncSidebarHeight();
});
window.addEventListener("resize", syncSidebarHeight);

// Parse dd-mm-yyyy (or yyyy-mm-dd) into a Date.
function parseDate(s, fmt) {
  const m = String(s).trim().match(/(\d{1,4})[-\/](\d{1,2})[-\/](\d{1,4})/);
  if (!m) return null;
  let d, mo, y;
  if (fmt === "DMY") { d = +m[1]; mo = +m[2]; y = +m[3]; }
  else { y = +m[1]; mo = +m[2]; d = +m[3]; }
  const dt = new Date(y, mo - 1, d);
  return isNaN(dt) ? null : dt;
}

function fmtDate(dt) {
  if (!dt) return "";
  return `${dt.getDate()} ${TRANSLATIONS[LANG].months[dt.getMonth()]} ${dt.getFullYear()}`;
}

// Returns {kind, flag, clickable} for a tournament. Hint text is looked up
// by kind at render time so it follows the active language.
function tournamentStatus(date, expiry, hasResults, today) {
  if (date && date > today)
    return { kind: "Upcoming", flag: "🕜", clickable: false };
  if (!hasResults)
    return { kind: "Pending",  flag: "⏳", clickable: false };
  if (expiry && expiry >= today)
    return { kind: "Active",   flag: "🏆", clickable: true };
  return { kind: "Historic",   flag: "📜", clickable: true };
}

// Picks the tournament to show first: walking from the top (newest), the
// first one that is not in the future and already has results entered.
// Falls back to the first tournament that has results at all.
function chooseInitial(items, today) {
  for (const it of items) {
    const future = it.date && it.date > today;
    if (!future && it.hasResults) return it;
  }
  return items.find(it => it.hasResults) || items[0];
}

let TOURNAMENTS = [];     // parsed tournament data (fetched once)
let showFuture = false;   // whether upcoming tournaments are shown
let selectedTab = null;   // currently selected tournament tab

async function loadTournamentList() {
  const idx = CONFIG.TOURNAMENTS_INDEX;
  try {
    const { rows } = await fetchTab({ gid: idx.gid });
    const list = rows.filter(r => (r[idx.tabCol] || "").trim() !== "");
    if (!list.length) throw new Error("empty");

    const today = new Date(); today.setHours(0, 0, 0, 0);
    TOURNAMENTS = list.map(r => {
      const tab    = r[idx.tabCol].trim();
      const name   = (r[idx.labelCol] || tab).trim();
      const date   = idx.dateCol   ? parseDate(r[idx.dateCol],   idx.dateFormat) : null;
      const expiry = idx.expiryCol ? parseDate(r[idx.expiryCol], idx.dateFormat) : null;
      const hasResults = idx.countCol ? (r[idx.countCol] || "").trim() !== "" : true;
      const st     = tournamentStatus(date, expiry, hasResults, today);
      const isFuture = !!(date && date > today);
      const nafLink = (idx.nafLinkCol && (r[idx.nafLinkCol] || "").trim()) ? r[idx.nafLinkCol].trim() : "";
      const fallbackURL = (idx.urlCol && (r[idx.urlCol] || "").trim())
        ? sanitizeHref(r[idx.urlCol].trim())
        : (idx.urlPlaceholder || "");
      const url = sanitizeHref(nafLink) || fallbackURL;
      return { tab, name, date, expiry, st, hasResults, isFuture, url };
    });

    // Prefer a tournament requested via the URL hash, if valid and clickable.
    let initial = null;
    if (requestedTab) {
      const match = TOURNAMENTS.find(it => it.tab === requestedTab && it.st.clickable);
      if (match) {
        initial = match;
        // If it's a hidden future tournament (shouldn't be clickable, but
        // guard anyway), reveal future so it appears in the list.
        if (match.isFuture) showFuture = true;
      }
    }
    if (!initial) initial = chooseInitial(TOURNAMENTS, today) || TOURNAMENTS[0];
    selectedTab = initial.tab;
    renderTournamentList();
    renderStandingsMeta();
    renderUpcoming();
    loadResults(initial.tab);
    requestedTab = null;
    // Re-load standings now that TOURNAMENTS (and expiry dates) are available
    loadStandings();
  } catch (e) {
    document.getElementById("results-host").innerHTML =
      `<div class="state err">${t("errList")}
        <span class="small">${t("errListHint")} (gid ${CONFIG.TOURNAMENTS_INDEX.gid})</span></div>`;
  }
}

// Generates the full flag hint text, including the expiry date for active tournaments
function getTournamentFlagHint(tournament) {
  const baseHint = t("flag" + tournament.st.kind);
  if (tournament.st.kind === "Active" && tournament.expiry) {
    return `${baseHint} (${t("countsUntil")} ${fmtDate(tournament.expiry)})`;
  }
  return baseHint;
}

// Finds all tournaments with expiry dates and reads coach points from
// the Deelnemers tab columns. For each coach, uses the first tournament (by expiry) with non-zero points.
function getExpiryRiskData(standingsRows) {
  // Get all tournaments with expiry dates, sorted by expiry (includes past and future)
  const tourneysWithExpiry = TOURNAMENTS
    .filter(t => t.expiry)
    .sort((a, b) => (a.expiry?.getTime() || 0) - (b.expiry?.getTime() || 0));
  if (!tourneysWithExpiry.length || !standingsRows.length) return null;

  const normalize = (text) => String(text || "").trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, "");

  const headers = Object.keys(standingsRows[0]);
  const nafCol = CONFIG.STANDINGS_COLUMNS.find(c => c.key === "nafnr")?.col;
  if (!nafCol) return null;

  const remainingHeaders = [...headers];
  const tournamentColumns = tourneysWithExpiry.map(tourney => {
    const normalizedCode = normalize(tourney.tab);
    
    // First try: exact match on tournament code
    let bestHeader = remainingHeaders.find(h => normalize(h) === normalizedCode);
    
    if (bestHeader) {
      remainingHeaders.splice(remainingHeaders.indexOf(bestHeader), 1);
      return { tourney, header: bestHeader };
    }
    
    // Fall back to name match only if code match fails
    const normalizedName = normalize(tourney.name);
    bestHeader = remainingHeaders.find(h => normalize(h) === normalizedName);
    
    if (bestHeader) {
      remainingHeaders.splice(remainingHeaders.indexOf(bestHeader), 1);
      return { tourney, header: bestHeader };
    }
    
    return null;
  }).filter(Boolean);
  if (!tournamentColumns.length) return null;

  const riskMap = new Map();
  standingsRows.forEach(r => {
    const naf = (r[nafCol] || "").trim();
    if (!naf) return;
    for (const { tourney, header } of tournamentColumns) {
      const pts = parseFloat(String(r[header] || "").replace(",", "."));
      if (Number.isFinite(pts) && pts > 0) {
        riskMap.set(naf, { points: pts, tourney });
        break;
      }
    }
  });

  return { riskMap };
}

// Renders the sidebar from TOURNAMENTS; safe to call again on language
// change or when toggling the future-tournaments visibility.
function renderTournamentList() {
  const listHost = document.getElementById("tourney-list");
  const futureBtn = document.getElementById("show-future");
  if (!TOURNAMENTS.length) return;
  listHost.innerHTML = "";

  const visible = TOURNAMENTS.filter(it => !it.isFuture);

  visible.forEach(it => {
    const btn = document.createElement("button");
    btn.dataset.tab = it.tab;
    btn.className = "tourney-item"
      + (it.tab === selectedTab ? " active" : "")
      + (it.st.clickable ? "" : " disabled");
    btn.innerHTML =
      `<span class="ti-name"><span class="ti-text">${esc(it.name)}</span>` +
      `<span class="ti-flag" title="${getTournamentFlagHint(it)}">${it.st.flag}</span>` +
      `</span>` +
      (it.date ? `<span class="ti-date">${fmtDate(it.date)}</span>` : ``);
    if (it.st.clickable) {
      btn.addEventListener("click", () => {
        setSelectedTournament(it.tab);
        loadResults(it.tab);
        writeHash();
        closeMobilePicker();
      });
    } else {
      btn.disabled = true;
    }
    listHost.appendChild(btn);
  });

  // Legend — fixed, outside the collapsible list, always all four categories.
  const legend = [
    { flag: "🏆", key: "legendActive"   },
    { flag: "⏳", key: "legendPending"  },
    { flag: "🕜", key: "legendUpcoming" },
    { flag: "📜", key: "legendHistoric" },
  ];
  document.getElementById("sidebar-legend").innerHTML =
    legend.map(l => `<span>${l.flag} ${t(l.key)}</span>`).join("");

  // Future toggle: only relevant if any future tournaments exist.
  futureBtn.hidden = true;

  if (currentView === "results") syncSidebarHeight();
  updateMobilePicker();
}

function setSelectedTournament(tab, { write = false } = {}) {
  selectedTab = tab;
  document.querySelectorAll(".tourney-item").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === tab));
  updateMobilePicker();
  if (write) writeHash();
}

document.getElementById("show-future").addEventListener("click", () => {
  showFuture = !showFuture;
  renderTournamentList();
});

// ---- Mobile tournament picker ----
function updateMobilePicker() {
  const label = document.getElementById("mobile-picker-label");
  if (!label) return;
  const sel = TOURNAMENTS.find(it => it.tab === selectedTab);
  label.textContent = sel ? sel.name : t("pickTournament");
}
function closeMobilePicker() {
  const wrap = document.getElementById("sidebar-wrap");
  const btn = document.getElementById("mobile-picker");
  wrap.classList.remove("open");
  btn.classList.remove("open");
  btn.setAttribute("aria-expanded", "false");
}
document.getElementById("mobile-picker").addEventListener("click", () => {
  const wrap = document.getElementById("sidebar-wrap");
  const btn = document.getElementById("mobile-picker");
  const open = wrap.classList.toggle("open");
  btn.classList.toggle("open", open);
  btn.setAttribute("aria-expanded", open ? "true" : "false");
});

// "Stand na <toernooi> (datum)" — the newest tournament that has results,
// regardless of whether it still counts. Hidden until data is available.
function renderStandingsMeta() {
  const el = document.getElementById("standings-meta");
  if (!el) return;
  const latest = TOURNAMENTS.find(it => it.hasResults);
  if (!latest) { el.hidden = true; return; }
  const datePart = latest.date ? ` (${fmtDate(latest.date)})` : "";
  el.innerHTML = `${t("standingsAfter")} <b>${esc(latest.name)}</b>${datePart}`;
  el.hidden = false;
}

// ---- Upcoming tournament banners ----
let rotatorTimer = null;
function upcomingList() {
  // Upcoming = future date; soonest first.
  return TOURNAMENTS.filter(it => it.isFuture)
    .slice()
    .sort((a, b) => (a.date?.getTime() || 0) - (b.date?.getTime() || 0));
}
function upEntryHTML(it) {
  const url = sanitizeHref(it.url || "#");
  return `<a class="up-entry" href="${esc(url)}" target="naf-info" rel="noopener">` +
         `<span class="up-name">${esc(it.name)}</span>` +
         (it.date ? `<span class="up-sep">·</span><span class="up-date">${fmtDate(it.date)}</span>` : ``) +
         `</a>`;
}
let rotatorIdx = 0;
function rotateTo(i) {
  const items = document.querySelectorAll("#up-rotate-track .up-item");
  if (!items.length) return;
  items[rotatorIdx]?.classList.remove("active");
  rotatorIdx = (i + items.length) % items.length;
  items[rotatorIdx].classList.add("active");
}
function startRotator(count) {
  if (rotatorTimer) clearInterval(rotatorTimer);
  if (count > 1) rotatorTimer = setInterval(() => rotateTo(rotatorIdx + 1), 3500);
}
function renderUpcoming() {
  const list = upcomingList();

  // ---- Full-width rotator (standings tab) ----
  const rotator = document.getElementById("upcoming-rotator");
  document.getElementById("up-label-1").textContent = t("upcomingLabel");
  if (!list.length) {
    rotator.hidden = true;
    if (rotatorTimer) clearInterval(rotatorTimer);
  } else {
    rotator.hidden = currentView !== "standings";
    const rTrack = document.getElementById("up-rotate-track");
    rTrack.innerHTML = list.map((it, i) =>
      `<div class="up-item${i === 0 ? " active" : ""}">${upEntryHTML(it)}</div>`).join("");
    rotatorIdx = 0;
    startRotator(list.length);
    document.getElementById("up-next").style.display = list.length > 1 ? "" : "none";
    rotator.onmouseenter = () => { if (rotatorTimer) clearInterval(rotatorTimer); };
    rotator.onmouseleave = () => startRotator(list.length);
  }

}

// Manual advance: go to next and restart the auto-timer so it doesn't
// jump again immediately after a click.
document.getElementById("up-next").addEventListener("click", () => {
  rotateTo(rotatorIdx + 1);
  startRotator(upcomingList().length);
});

// ---- View switching ----
let currentView = "standings";
function switchView(view, { write = true } = {}) {
  currentView = view;
  document.querySelectorAll(".vtab").forEach(b =>
    b.classList.toggle("active", b.dataset.view === view));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("show"));
  document.getElementById("panel-" + view).classList.add("show");
  // Toggle ticker placement: rotator only on standings.
  if (TOURNAMENTS.length) {
    const hasUp = upcomingList().length > 0;
    document.getElementById("upcoming-rotator").hidden  = !hasUp || view !== "standings";
  }
  // Ensure timers are not running for hidden tickers.
  if (view !== "standings" && rotatorTimer) { clearInterval(rotatorTimer); rotatorTimer = null; }
  if (view === "results") syncSidebarHeight();
  if (write) writeHash();
}
document.querySelectorAll(".vtab").forEach(btn => {
  btn.addEventListener("click", () => switchView(btn.dataset.view));
});

// ---- State in the URL hash: #<lang>/<view>[/<tab>] ----
// Robust inside an iframe embed and gives shareable links.
let restoringHash = false;
function writeHash() {
  if (restoringHash) return;
  const parts = [currentView];
  if (currentView === "results" && selectedTab) parts.push(encodeURIComponent(selectedTab));
  const h = "#" + parts.join("/");
  if (location.hash !== h) {
    history.replaceState(null, "", h);
  }
}
function parseHash() {
  const raw = (location.hash || "").replace(/^#/, "");
  if (!raw) return null;
  const seg = raw.split("/");
  const out = {};
  if (seg[0] === "standings" || seg[0] === "results") out.view = seg[0];
  if (seg[1]) out.tab = decodeURIComponent(seg[1]);
  return out;
}

// ---- Language application ----
// Updates only static chrome (header, tabs, footer, flag state).
function applyStaticLang() {
  document.documentElement.lang = LANG;
  document.getElementById("t-title").textContent     = t("title");
  document.getElementById("t-tagline").innerHTML     = t("tagline");
  document.getElementById("t-tab-standings").textContent = t("tabStandings");
  document.getElementById("t-tab-results").textContent   = t("tabResults");
  document.getElementById("t-footer").innerHTML =
    `${t("footer")}<button id="clear-cache" class="footer-action">${t("clearCache")}</button>` +
    `<span id="footer-status" class="footer-status"></span>`;
  document.getElementById("clear-cache").onclick = clearCache;
  document.getElementById("lang-nl").classList.toggle("active", LANG === "nl");
  document.getElementById("lang-en").classList.toggle("active", LANG === "en");
}

// Inline SVG flags so they render identically on every OS (incl. Windows).
const FLAG_NL =
  `<svg viewBox="0 0 9 6" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
     <rect width="9" height="6" fill="#21468B"/>
     <rect width="9" height="4" fill="#FFF"/>
     <rect width="9" height="2" fill="#AE1C28"/>
   </svg>`;
const FLAG_GB =
  `<svg viewBox="0 0 60 30" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
     <clipPath id="ukclip"><rect width="60" height="30"/></clipPath>
     <g clip-path="url(#ukclip)">
       <rect width="60" height="30" fill="#012169"/>
       <path d="M0,0 60,30 M60,0 0,30" stroke="#FFF" stroke-width="6"/>
       <path d="M0,0 60,30 M60,0 0,30" stroke="#C8102E" stroke-width="4"/>
       <path d="M30,0 V30 M0,15 H60" stroke="#FFF" stroke-width="10"/>
       <path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/>
     </g>
   </svg>`;
document.getElementById("lang-nl").innerHTML = FLAG_NL;
document.getElementById("lang-en").innerHTML = FLAG_GB;

const coachModalBackdrop = document.getElementById("coach-modal-backdrop");
const coachModalClose = document.getElementById("coach-modal-close");
if (coachModalBackdrop) {
  coachModalBackdrop.addEventListener("click", (e) => {
    if (e.target === coachModalBackdrop) closeCoachModal();
  });
}
if (coachModalClose) {
  coachModalClose.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    closeCoachModal();
  });
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && activeCoachModalRow) closeCoachModal();
});
renderCoachModal();

function setLang(lang) {
  if (lang === LANG) return;
  LANG = lang;
  applyStaticLang();
  // Re-render dynamic content in the new language.
  loadStandings();
  if (TOURNAMENTS.length) {
    renderTournamentList();
    renderStandingsMeta();
    renderUpcoming();
    if (currentResultsTab) loadResults(currentResultsTab);
  }
  writeHash();
}
document.getElementById("lang-nl").addEventListener("click", () => setLang("nl"));
document.getElementById("lang-en").addEventListener("click", () => setLang("en"));

// ---- Initial load ----
let requestedTab = null;
(function restoreFromHash() {
  const h = parseHash();
  if (h && h.tab) requestedTab = h.tab;    // honored once TOURNAMENTS load
  // View is applied after static text so the panels exist.
  restoringHash = true;
  applyStaticLang();
  switchView(h && h.view ? h.view : "standings", { write: false });
  restoringHash = false;
})();

loadStandings();
loadTournamentList();

// React to manual hash edits / back-forward navigation.
window.addEventListener("hashchange", () => {
  const h = parseHash();
  if (!h) return;
  if (h.view && h.view !== currentView) switchView(h.view, { write: false });
  if (h.view === "results" && h.tab && h.tab !== selectedTab) {
    const match = TOURNAMENTS.find(it => it.tab === h.tab && it.st.clickable);
    if (match) {
      selectedTab = match.tab;
      if (document.querySelectorAll(".tourney-item").length) {
        setSelectedTournament(match.tab);
      } else {
        renderTournamentList();
      }
      loadResults(match.tab);
    }
  }
});

// Keep the sidebar height in step with the results table on initial load.
(function initSidebarHeightSync() {
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncSidebarHeight);
  window.addEventListener("load", syncSidebarHeight);
})();


</script>
